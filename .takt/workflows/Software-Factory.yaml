name: Software-Factory
description: >-
  GitHub Issue の列ラベル(stage:…)とゲートラベル(gate0〜2-approved)から、工場のラインでいま進めてよい工程を1つだけ選び、
  書く → takt の中で検証する(差し戻しループ)→ 工程別ブランチに push して Draft PR を作る → CI を見届ける、までを行って
  人のゲート判定に渡す。次の工程には進まない。止めるときは escalate が Issue に理由を書く。
  タスクの本文に Issue 番号(例: #123)を書いて実行する。番号がなければ止める。
  ゲートのガードを効かせるため、リポジトリの checkout で tools/factory/takt.sh <Issue番号> [claude|codex|copilot] から実行する
  (ガードが効いていなければ start が止める)。takt の worktree(共有 clone)は origin を外すため使わない。

# 1回の実行の上限。最も長い経路([B] で、CI の各回に検証の差し戻しを3回直し、CI の失敗を3回直したあとの4回目の失敗)は
# 62 step。judge の実行も見込んで余裕を持たせている。
max_steps: 80
initial_step: start

personas:
  factory-operator: ../facets/personas/factory-operator.md
  knowledge-extractor: ../facets/personas/knowledge-extractor.md
  knowledge-reviewer: ../facets/personas/knowledge-reviewer.md
  requirements-writer: ../facets/personas/requirements-writer.md
  screen-writer: ../facets/personas/screen-writer.md
  requirements-reviewer: ../facets/personas/requirements-reviewer.md
  spec-writer: ../facets/personas/spec-writer.md
  spec-reviewer: ../facets/personas/spec-reviewer.md
  implementer: ../facets/personas/implementer.md
  code-reviewer: ../facets/personas/code-reviewer.md

policies:
  factory-rules: ../facets/policies/factory-rules.md
  factory-review: ../facets/policies/factory-review.md
  review-viewpoints: ../facets/policies/review-viewpoints.md
  factory-coding: ../facets/policies/factory-coding.md

knowledge:
  factory-line: ../facets/knowledge/factory-line.md
  factory-pr: ../facets/knowledge/factory-pr.md
  factory-dev: ../facets/knowledge/factory-dev.md
  factory-testing: ../facets/knowledge/factory-testing.md
  factory-domain: ../facets/knowledge/factory-domain.md
  factory-schema: ../facets/knowledge/factory-schema.md

instructions:
  start: ../facets/instructions/factory-start.md
  knowledge-write: ../facets/instructions/knowledge-write.md
  knowledge-review: ../facets/instructions/knowledge-review.md
  requirements-write: ../facets/instructions/requirements-write.md
  screen-write: ../facets/instructions/screen-write.md
  requirements-review: ../facets/instructions/requirements-review.md
  spec-write: ../facets/instructions/spec-write.md
  spec-review: ../facets/instructions/spec-review.md
  implement: ../facets/instructions/implement.md
  code-review: ../facets/instructions/code-review.md
  publish: ../facets/instructions/factory-publish.md
  ci-wait: ../facets/instructions/factory-ci-wait.md
  ci-failed: ../facets/instructions/factory-ci-failed.md
  escalate: ../facets/instructions/factory-escalate.md
  review-limit-judge: ../facets/instructions/factory-review-limit-judge.md
  ci-limit-judge: ../facets/instructions/factory-ci-limit-judge.md

report_formats:
  start: ../facets/output-contracts/factory-start.md
  write: ../facets/output-contracts/factory-write.md
  knowledge-review: ../facets/output-contracts/knowledge-review.md
  requirements-review: ../facets/output-contracts/requirements-review.md
  spec-review: ../facets/output-contracts/spec-review.md
  code-review: ../facets/output-contracts/code-review.md
  publish: ../facets/output-contracts/factory-publish.md
  ci: ../facets/output-contracts/factory-ci.md
  ci-failure: ../facets/output-contracts/factory-ci-failure.md
  escalation: ../facets/output-contracts/factory-escalation.md

# 上限の数え方(検証の差し戻しも CI の失敗も、直すのは3回まで。4回目に通らなければ escalate で止めて人に渡す)
# takt の loop monitor は、次の step が cycle の先頭のときだけ、履歴の末尾から続く cycle の回数を数える。
# - 検証の差し戻し: 書く step → 検証 step の連続を数える。4回目の差し戻しで書く step に戻ろうとしたところで judge が止める。
#   publish・ci-wait・ci-failed は ignore しないので、CI の手直しの回ごとに数え直す。
#   [B] の差し戻しはいつも requirements-write に戻り、画面が要るときだけ screen-write を挟むので、screen-write を除いて数える。
# - CI の手直し: ci-failed → ci-wait の連続を、それ以外の step を除いて数える。CI の4回目の失敗(3回直しても失敗)で
#   ci-wait が終わり、ci-failed に進もうとしたところで(連続 3 回)judge が止める。
# judge の選択肢は1つだけにし、上限に達したら必ず止める。
loop_monitors:
  - cycle: [knowledge-write, knowledge-review]
    threshold: 4
    judge: &review-limit
      persona: factory-operator
      instruction: review-limit-judge
      rules:
        - condition: 検証の差し戻しを3回直しても、4回目の検証で指摘が残った
          next: escalate
  - cycle: [requirements-write, requirements-review]
    ignore_steps: [screen-write]
    threshold: 4
    judge: *review-limit
  - cycle: [spec-write, spec-review]
    threshold: 4
    judge: *review-limit
  - cycle: [implement, code-review]
    threshold: 4
    judge: *review-limit
  - cycle: [ci-failed, ci-wait]
    ignore_steps:
      - start
      - knowledge-write
      - knowledge-review
      - requirements-write
      - screen-write
      - requirements-review
      - spec-write
      - spec-review
      - implement
      - code-review
      - publish
      - escalate
    threshold: 3
    judge:
      persona: factory-operator
      instruction: ci-limit-judge
      rules:
        - condition: CI の失敗を3回直しても、4回目の CI が失敗した
          next: escalate

# capabilities: readonly の step で edit: true にしているのは、Bash(git・gh)を残すため。
# takt は edit が true でない step(出力契約あり)から Bash を外す。readonly の道具には Edit・Write がないので、
# ファイルの書き換えはできない。書き換えないことは persona・policy・instruction でも決めている。
steps:
  # 判定と着手の準備: Issue 番号を取り出し、列とゲートラベルから工程を1つ選び、ブランチ・前提ファイル・列ラベルを用意する。
  - name: start
    capabilities: readonly
    edit: true
    persona: factory-operator
    session: refresh
    policy: factory-rules
    knowledge: factory-line
    instruction: start
    pass_previous_response: false
    output_contracts:
      report:
        - name: start.md
          format: start
    rules:
      - condition: 実行環境が整っていない(origin がない・ゲートのガードが効いていない)、タスクに Issue 番号がない、Issue を読めない、または準備できなかった
        next: ABORT
      - condition: '[B] の候補だが、要件の土台になる業務ルールが確定していない(ナレッジが未確定)'
        next: escalate
      - condition: 進めてよい工程がない(判断待ち・表にない組み合わせ・WIP の上限を超えた・PR が既にあるなど)
        next: COMPLETE
      - condition: '[A] ナレッジの準備ができた'
        next: knowledge-write
      - condition: '[B] 要件・画面の準備ができた'
        next: requirements-write
      - condition: '[C] 仕様の準備ができた'
        next: spec-write
      - condition: '[D] 実装(着手または続き)の準備ができた'
        next: implement

  # [A] ナレッジ
  - name: knowledge-write
    capabilities: edit
    edit: true
    persona: knowledge-extractor
    policy: factory-rules
    knowledge: factory-line
    instruction: knowledge-write
    output_contracts:
      report:
        - name: knowledge-write.md
          format: write
    rules:
      - condition: ナレッジを書き終えた(足すものがないという判断を含む)
        next: knowledge-review
      - condition: 作業を進められない
        next: ABORT

  - name: knowledge-review
    capabilities: readonly
    edit: true
    persona: knowledge-reviewer
    policy:
      - factory-rules
      - factory-review
      - review-viewpoints
    knowledge:
      - factory-line
      - factory-pr
    instruction: knowledge-review
    pass_previous_response: false
    output_contracts:
      report:
        - name: knowledge-review.md
          format: knowledge-review
    rules:
      - condition: 指摘なし
        next: publish
      - condition: 指摘あり
        next: knowledge-write

  # [B] 要件・画面。画面の変更が要るかは requirements-write が判定する(検証の差し戻しのあとも同じ)。
  - name: requirements-write
    capabilities: edit
    edit: true
    persona: requirements-writer
    policy:
      - factory-rules
    knowledge:
      - factory-line
      - factory-dev
      - factory-testing
    instruction: requirements-write
    output_contracts:
      report:
        - name: requirements-write.md
          format: write
    rules:
      - condition: 要件を書き終え、画面の変更が要る
        next: screen-write
      - condition: 要件を書き終え、画面の変更は要らない
        next: requirements-review
      - condition: 要件の土台のナレッジが未確定・足りないので、要件を書かずに止めた
        next: escalate
      - condition: 作業を進められない
        next: ABORT

  - name: screen-write
    capabilities: edit
    edit: true
    persona: screen-writer
    policy: factory-rules
    knowledge:
      - factory-line
      - factory-dev
    instruction: screen-write
    output_contracts:
      report:
        - name: screen-write.md
          format: write
    rules:
      - condition: 画面要件を書き終えた
        next: requirements-review
      - condition: 作業を進められない
        next: ABORT

  - name: requirements-review
    capabilities: readonly
    edit: true
    persona: requirements-reviewer
    policy:
      - factory-rules
      - factory-review
      - review-viewpoints
    knowledge:
      - factory-line
      - factory-pr
      - factory-dev
      - factory-testing
    instruction: requirements-review
    pass_previous_response: false
    output_contracts:
      report:
        - name: requirements-review.md
          format: requirements-review
    rules:
      - condition: 指摘なし
        next: publish
      - condition: 指摘あり(画面だけの指摘も requirements-write に戻す)
        next: requirements-write

  # [C] 仕様
  - name: spec-write
    capabilities: edit
    edit: true
    persona: spec-writer
    policy:
      - factory-rules
    knowledge:
      - factory-line
      - factory-dev
      - factory-testing
      - factory-domain
    instruction: spec-write
    output_contracts:
      report:
        - name: spec-write.md
          format: write
    rules:
      - condition: 仕様を書き終えた
        next: spec-review
      - condition: 要件の穴を見つけて作業を止めた
        next: escalate
      - condition: 作業を進められない
        next: ABORT

  - name: spec-review
    capabilities: readonly
    edit: true
    persona: spec-reviewer
    policy:
      - factory-rules
      - factory-review
      - review-viewpoints
    knowledge:
      - factory-line
      - factory-pr
      - factory-dev
      - factory-testing
      - factory-domain
    instruction: spec-review
    pass_previous_response: false
    output_contracts:
      report:
        - name: spec-review.md
          format: spec-review
    rules:
      - condition: 指摘なし
        next: publish
      - condition: 指摘あり
        next: spec-write

  # [D] 実装 / [E] 検証。stage:実装中 の続きも同じ step で扱う。
  - name: implement
    capabilities: edit
    edit: true
    persona: implementer
    policy:
      - factory-rules
      - factory-coding
    knowledge:
      - factory-dev
      - factory-testing
      - factory-domain
      - factory-schema
    instruction: implement
    output_contracts:
      report:
        - name: implement.md
          format: write
    rules:
      - condition: 実装を終えた
        next: code-review
      - condition: 要件・仕様の穴を見つけて作業を止めた(前提の版の食い違いを含む)
        next: escalate
      - condition: 作業を進められない
        next: ABORT

  - name: code-review
    capabilities: readonly
    edit: true
    persona: code-reviewer
    policy:
      - factory-rules
      - factory-review
      - review-viewpoints
      - factory-coding
    knowledge:
      - factory-line
      - factory-pr
      - factory-dev
      - factory-testing
      - factory-domain
      - factory-schema
    instruction: code-review
    pass_previous_response: false
    output_contracts:
      report:
        - name: code-review.md
          format: code-review
    rules:
      - condition: 指摘なし
        next: publish
      - condition: 指摘あり
        next: implement

  # 公開: コミット・プッシュ・Draft PR の作成か更新、最終的な検証結果のコメント。
  - name: publish
    capabilities: edit
    edit: true
    allow_git_commit: true
    persona: factory-operator
    session: refresh
    policy: factory-rules
    knowledge:
      - factory-line
      - factory-pr
    instruction: publish
    pass_previous_response: false
    output_contracts:
      report:
        - name: publish.md
          format: publish
    rules:
      - condition: Draft PR を作成または更新した
        next: ci-wait
      - condition: '[A] で変更がなく、PR を作らずに Issue へ報告した'
        next: COMPLETE
      - condition: 公開できなかった
        next: ABORT

  # CI 待ち: 成功なら完了。失敗なら ci-failed から工程の書く step に戻す。
  - name: ci-wait
    capabilities: readonly
    edit: true
    persona: factory-operator
    # 前の step の会話は要らない(レポートとコマンドの出力で判断する)ため、毎回新しいセッションで始める。
    session: refresh
    policy: factory-rules
    knowledge: factory-pr
    instruction: ci-wait
    pass_previous_response: false
    output_contracts:
      report:
        - name: ci-wait.md
          format: ci
    rules:
      - condition: CI の必須チェックがすべて成功した
        next: COMPLETE
      - condition: CI の必須チェックが失敗した
        next: ci-failed
      - condition: CI の結果を確かめられなかった
        next: ABORT

  - name: ci-failed
    capabilities: readonly
    edit: true
    persona: factory-operator
    # 前の step の会話は要らない(レポートとコマンドの出力で判断する)ため、毎回新しいセッションで始める。
    session: refresh
    policy: factory-rules
    knowledge:
      - factory-line
      - factory-pr
    instruction: ci-failed
    pass_previous_response: false
    output_contracts:
      report:
        - name: ci-failure.md
          format: ci-failure
    rules:
      - condition: '[A] ナレッジの書く step で直す'
        next: knowledge-write
      - condition: '[B] 要件・画面の書く step で直す'
        next: requirements-write
      - condition: '[C] 仕様の書く step で直す'
        next: spec-write
      - condition: '[D] 実装の書く step で直す'
        next: implement

  # 人に渡して止める: ナレッジが未確定・要件の穴・検証の差し戻しの上限・CI の手直しの上限を、Issue にコメントする。
  # 理由は前の step の出力とレポートから決める。要件の穴だけ、列を stage:判断待ち にして needs-answer を付ける。
  - name: escalate
    capabilities: readonly
    edit: true
    persona: factory-operator
    session: refresh
    policy: factory-rules
    knowledge:
      - factory-line
      - factory-pr
    instruction: escalate
    output_contracts:
      report:
        - name: escalate.md
          format: escalation
    rules:
      - condition: ナレッジが未確定、または要件の穴を Issue に報告した(同じ報告が既にあって書かなかった場合を含む)
        next: COMPLETE
      - condition: 検証の差し戻しか CI の手直しの上限に達したことを Issue に報告した
        next: ABORT
      - condition: 止めた理由を決められなかった、または Issue に報告できなかった
        next: ABORT
