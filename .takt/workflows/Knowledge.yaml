name: Knowledge
description: >-
  工程 [A] ナレッジ。資料・Issue・回答から knowledge/ の用語・業務ルール・未確定事項を書き、検証して Draft PR を出す。
  tools/factory/takt.sh が、ラベルの確認とブランチの用意をしてから呼ぶ。直接は呼ばない。

max_steps: 20
initial_step: knowledge-write

loop_monitors:
  - cycle: [knowledge-write, knowledge-review]
    threshold: 4
    judge:
      persona: factory-operator
      instruction: factory-review-limit-judge
      rules:
        - condition: 検証の差し戻しを3回直しても、4回目の検証で指摘が残った
          next: publish

steps:
  - name: knowledge-write
    capabilities: edit
    edit: true
    persona: knowledge-extractor
    policy: factory-rules
    knowledge: factory-line
    instruction: knowledge-write
    output_contracts:
      report:
        - name: knowledge-write.md
          format: factory-write
    rules:
      - condition: ナレッジを書き終えた(足すものがないという判断を含む)
        next: knowledge-review
      - condition: 作業を進められない
        next: ABORT

  - name: knowledge-review
    capabilities: readonly
    edit: true
    persona: knowledge-reviewer
    policy: [factory-rules, factory-review, review-viewpoints]
    knowledge: [factory-line, factory-pr]
    instruction: knowledge-review
    pass_previous_response: false
    output_contracts:
      report:
        - name: knowledge-review.md
          format: knowledge-review
    rules:
      - condition: 指摘なし
        next: publish
      - condition: 指摘あり
        next: knowledge-write

  - name: publish
    uses: factory-publish
    rules:
      - condition: Draft PR を作成または更新した
        next: COMPLETE
      - condition: 変更がなく、PR を作らずに Issue へ報告した
        next: COMPLETE
      - condition: 公開できなかった
        next: ABORT
