# 画面要件の一覧(requirements/screens/README.md)。
screens:
  - id: SCR-001
    title: 費目マスタ
    route: /cost-elements
    page: frontend/src/pages/CostElementsPage.tsx
    requirements: [FR-3.1, FR-3.3]
    items:
      - パンくず(部一覧へのリンク)
      - 費目マスタがシステム共通であることの説明
      - 費目コードと費目名の表
      - 費目を追加するフォーム(費目コード・費目名・追加ボタン)
    operations:
      - name: 費目を追加する
        request: POST /api/cost-elements
    states:
      - name: 通常
        shows: 費目の表に人件費とライセンス費の 2 行が出る
      - name: 空
        shows: 表の代わりに「費目がありません。下のフォームから追加してください。」が出る
      - name: エラー
        shows: 画面右下のトーストに API のエラーメッセージが出て、表の代わりに「費目がありません。」が出る

  - id: SCR-002
    title: 予算編集
    route: /departments/22222222-2222-4222-8222-222222222222/budgets/33333333-3333-4333-8333-333333333333?half=2026-H2
    page: frontend/src/pages/BudgetEditPage.tsx
    requirements: [FR-4.18, FR-4.19, FR-4.20]
    items:
      - パンくず(課一覧・課詳細へのリンク)
      - 予算の見出し(バージョン・予算名・半期・状態のバッジ)
      - 区分合計と計画損益・粗利率のサマリ
      - この予算を承認するボタン(状態が策定中のときだけ。明細が 0 件のときは押せない)
      - 案件別の売上高・加工費・外注費の表(策定中のときは金額の入力欄。セルを離れると保存する)
      - 案件を追加するフォーム(策定中のときだけ)
      - 期間費用の表(費目一括の金額・明細名つきの明細・明細の追加)
      - 衝突のメッセージのトースト。明細の保存・明細の削除・明細名の変更・承認のどれかが衝突として拒否されたとき、画面右下のトーストに「ほかの画面でこの予算が更新されました。最新の内容を読み込み直しました。もう一度入力してください。」を出す(FR-4.19、BR-BUD-008)
      - 衝突のあとの表示。衝突として拒否されたとき、予算を読み込み直して、サマリ・案件別の表・期間費用の表にその予算の最新の内容を出す。拒否された入力は入力欄から消える(FR-4.18、BR-BUD-008)
    operations:
      - name: 明細の金額を保存する(前の保存の応答を受け取ってから送る。FR-4.20)
        request: PUT /api/budgets/{budgetId}/lines
      - name: 明細を削除する(金額の入力欄を空にするか 0 にして離れる。期間費用の明細の削除ボタン)
        request: DELETE /api/budgets/{budgetId}/lines
      - name: 期間費用の明細名を変更する
        request: POST /api/budgets/{budgetId}/rename-period-detail
      - name: この予算を承認する
        request: POST /api/budgets/{budgetId}/approve
    states:
      - name: 通常
        shows: 策定中の v1 当初予算(2026年度 下期)。サマリは売上高 ¥1,500,000・加工費 ¥300,000・外注費 ¥0・期間費用 ¥200,000・計画損益 ¥1,000,000。案件X の売上高の入力欄に 1,000,000・加工費に 300,000、案件Y の売上高に 500,000、期間費用の人件費に 200,000 が入り、承認ボタンが押せる
      - name: 空
        shows: 策定中の v1 当初予算で明細が 0 件。サマリはすべて ¥0、案件の表に「案件がありません。下の行から案件を追加してください。」が出て、承認ボタンは押せない。期間費用の表には人件費とライセンス費の空の入力欄が出る
      - name: エラー
        shows: '予算の読み込みが失敗し、画面右下のトーストに「予算が見つかりません: 33333333-3333-4333-8333-333333333333」が出る。見出しはバージョンの数字と予算名がなく「v」だけで、状態のバッジは「失効」(いまの画面は、予算を読めないときに状態を失効と表示する)。サマリはすべて ¥0、承認ボタンは出ず、「このバージョンは編集できません。変更するには改定版を作成してください。」が出る'

  - id: SCR-003
    title: 課詳細
    route: /departments/22222222-2222-4222-8222-222222222222?half=2026-H2
    page: frontend/src/pages/DepartmentDetailPage.tsx
    requirements: [FR-4.18, FR-4.19]
    items:
      - パンくず(部一覧・部・課)
      - 課コードと課名の見出し、対象半期の選択、実績入力・予実差異分析・予算バージョン比較へのボタン
      - 承認済みの予算の区分合計と計画損益・粗利率のサマリ(承認済みの予算があるときだけ)
      - 予算バージョンの表(バージョン・名称・状態・売上高・総コスト・損益・承認日時。策定中の行に承認ボタン)
      - 当初予算・改定版を作成するフォーム(策定中のドラフトがあるときは作成ボタンが押せない)
      - 衝突のメッセージのトースト。承認が衝突として拒否されたとき、画面右下のトーストに「ほかの画面でこの予算が更新されました。最新の内容を読み込み直しました。もう一度入力してください。」を出す(FR-4.19、BR-BUD-008)
      - 衝突のあとの表示。承認が衝突として拒否されたとき、予算バージョンの表を読み込み直して、その予算の最新の内容(状態・売上高・総コスト・損益)を出す(FR-4.18、BR-BUD-008)
    operations:
      - name: 策定中の予算を承認する
        request: POST /api/budgets/{budgetId}/approve
      - name: 当初予算・改定版のドラフトを作成する
        request: POST /api/departments/{id}/budgets
    states:
      - name: 通常
        shows: 見出しは D-01 開発一課、パンくずは 部一覧 / 開発部 / 開発一課。サマリは承認済みの v1 の売上高予算 ¥1,500,000・計画損益 ¥1,000,000。予算バージョンの表に v1 当初予算(承認済、承認日時 2026/10/5 10:00:00)と v2 下期見直し(策定中、承認ボタンあり)の 2 行が出て、ドラフト作成ボタンは押せず「策定中のドラフトを先に承認してください。」が出る
      - name: 空
        shows: 予算がない課。サマリは出ず、表の代わりに「予算がまだありません。下のフォームから当初予算を作成してください。」が出て、「当初予算の作成」のフォームのドラフト作成ボタンが押せる
      - name: エラー
        shows: '課と予算の一覧の読み込みが失敗し、画面右下のトーストに「課が見つかりません: 22222222-2222-4222-8222-222222222222」が出る。パンくずの部名と課名は「…」、見出しの課コードと課名は空、サマリは出ず、表の代わりに「予算がまだありません。下のフォームから当初予算を作成してください。」が出る'
