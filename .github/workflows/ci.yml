name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: バックエンド(ビルド・テスト)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: .NET 10 SDK をセットアップ
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: ビルドとテスト(ドメイン + アーキテクチャ)
        run: >
          dotnet test backend
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: テスト結果レポートを公開
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: backend-test-results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: カバレッジレポートを生成して実行サマリに表示
        if: success() || failure()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:CoverageReport \
            -reporttypes:"MarkdownSummaryGithub;Html;Badges" \
            "-assemblyfilters:+CostManagement.*;-CostManagement.*.Tests"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: カバレッジHTMLレポートを保存(アーティファクト)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: CoverageReport

  frontend-unit:
    name: フロントエンド単独テスト(Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/unit/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/unit/frontend/package-lock.json

      # frontend/src の画面とロジックをこのパッケージの React で動かす(frontend 側の npm ci は不要)
      - name: 依存関係をインストール
        run: npm ci

      - name: 静的解析・型チェック・書式チェック
        run: |
          npm run lint
          npm run typecheck
          npm run format:check

      - name: テストを実行(API は MSW でモック)
        run: npm test

  browser-e2e:
    name: ブラウザE2E(Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e/browser
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: .NET 10 SDK をセットアップ
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/browser/package-lock.json

      - name: 依存関係をインストール(画面の開発サーバ用の frontend と、E2E 本体の tests/e2e/browser)
        run: |
          npm ci --prefix ../../../frontend
          npm ci

      - name: 静的解析・型チェック・書式チェック(E2E のステップ定義)
        run: |
          npm run lint
          npm run typecheck
          npm run format:check

      # ブラウザは Playwright の版ごとにキャッシュする。ヘッドレスのテストに要るのはヘッドレスシェルだけなので、
      # 本体の Chromium(約 190 MiB)は入れない。OS の依存(--with-deps)は ubuntu ランナーに揃っているので入れない
      # (apt の更新が毎回 15 秒前後かかっていた。足りなければ起動時に Playwright が不足を名指しで落とす)。Issue #63
      - name: Playwright の版を調べる(ブラウザのキャッシュのキー)
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Chromium のキャッシュを戻す
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-headless-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium をインストール(キャッシュがないときだけ)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"

      - name: E2E テストを実行(Gherkin からテストを生成し、バックエンド+フロントエンドを自動起動)
        run: npm test

      - name: 失敗時のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/browser/playwright-report
            tests/e2e/browser/test-results

  frontend:
    name: フロントエンド(静的解析・型チェック・ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: API の型が OpenAPI 定義(docs/api/openapi.json)と一致するか
        run: |
          npm run gen:api
          git diff --exit-code src/api-schema.d.ts || {
            echo "::error::src/api-schema.d.ts が docs/api/openapi.json と一致しません。cd frontend && npm run gen:api を実行してコミットしてください。"
            exit 1
          }

      - name: 静的解析(ESLint)
        run: npm run lint

      - name: 書式チェック(Prettier)
        run: npm run format:check

      - name: 型チェックとビルド
        run: npm run build

  mutation:
    name: ミューテーションテスト(Stryker.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7

      - name: .NET 10 SDK をセットアップ
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: ツールを復元(dotnet-stryker)
        run: dotnet tool restore

      - name: ミューテーションテストを実行(Domain + Application)
        run: |
          status=0
          for dir in unit/backend/Domain integration/backend/Application; do
            echo "::group::Stryker ${dir}"
            (cd "${dir}" && dotnet tool run dotnet-stryker) || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: ミューテーションスコアを実行サマリに表示
        if: always()
        run: |
          {
            echo '## ミューテーションテスト(Stryker.NET)'
            echo
            echo 'ミュータント(意図的なコード改変)をテストが検出できた割合。スコアが低い箇所は「テストが通っても仕様を守れていない」可能性がある。対象は Domain・Application 層(閾値は high:80 / low:60、CIは非ブロッキング)。'
            echo
            for dir in unit/backend/Domain integration/backend/Application; do
              proj=$(basename "$dir")
              md=$(ls -t "${dir}"/StrykerOutput/*/reports/mutation-report.md 2>/dev/null | head -1)
              if [ -n "$md" ]; then
                echo "### ${proj} 層"
                echo
                cat "$md"
                echo
              else
                echo "### ${proj} 層"
                echo
                echo '（レポートが生成されませんでした）'
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: HTMLレポートを保存(アーティファクト)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: tests/*/backend/*/StrykerOutput/*/reports/mutation-report.html

  metrics:
    name: コードメトリクス(行数・複雑度)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cloc をインストール
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: scc をインストール(クロスプラットフォームのメトリクス集計)
        run: go install github.com/boyter/scc/v3@latest

      - name: 行数(cloc)と複雑度(scc)を区分ごとに集計
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          OUT=metrics-report.md
          : > "$OUT"
          EXCLUDES="bin,obj,dist,node_modules,.features-gen,StrykerOutput"
          区分() {
            local label="$1" dir="$2"
            {
              echo "#### ${label}（\`${dir}\`）"
              echo
              echo '**行数（cloc）**'
              echo
              cloc "$dir" --md --quiet --exclude-dir="$EXCLUDES"
              echo
              echo '**複雑度・行数（scc）**'
              echo
              echo '```'
              scc "$dir" --no-cocomo --exclude-dir "$EXCLUDES"
              echo '```'
              echo
            } >> "$OUT"
          }
          {
            echo '## コードメトリクス'
            echo
            echo '`cloc` は言語別の行数（コード/コメント/空行）、`scc` は行数＋複雑度（分岐数ベースの循環的複雑度の近似）を集計します。'
            echo
          } >> "$OUT"
          区分 'バックエンド 本体' backend/src
          区分 'フロントエンド' frontend/src
          区分 'テスト(単体)' tests/unit
          区分 'テスト(結合)' tests/integration
          区分 'テスト(E2E)' tests/e2e
          区分 'テスト(アーキテクチャ)' tests/architecture
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: メトリクスレポートを保存(アーティファクト)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-metrics
          path: metrics-report.md
