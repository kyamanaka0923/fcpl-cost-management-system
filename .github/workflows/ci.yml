name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: バックエンド(ビルド・テスト)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 10 SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: ビルドとテスト(ドメイン + アーキテクチャ)
        run: >
          dotnet test backend
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: テスト結果レポートを公開
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: backend-test-results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: カバレッジレポートを生成して実行サマリに表示
        if: success() || failure()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:CoverageReport \
            -reporttypes:"MarkdownSummaryGithub;Html;Badges" \
            "-assemblyfilters:+CostManagement.*;-CostManagement.*.Tests"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: カバレッジHTMLレポートを保存(アーティファクト)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport

  browser-e2e:
    name: ブラウザE2E(Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: .NET 10 SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: Chromium をインストール
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"

      - name: E2E テストを実行(バックエンド+フロントエンドを自動起動)
        run: npx playwright test

      - name: 失敗時のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  frontend:
    name: フロントエンド(型チェック・ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: 型チェックとビルド
        run: npm run build
