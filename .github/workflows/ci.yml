name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: バックエンド(ビルド・テスト)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 10 SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: ビルドとテスト(ドメイン + アーキテクチャ)
        run: >
          dotnet test backend
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: テスト結果レポートを公開
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: backend-test-results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: カバレッジレポートを生成して実行サマリに表示
        if: success() || failure()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:CoverageReport \
            -reporttypes:"MarkdownSummaryGithub;Html;Badges" \
            "-assemblyfilters:+CostManagement.*;-CostManagement.*.Tests"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: カバレッジHTMLレポートを保存(アーティファクト)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport

  browser-e2e:
    name: ブラウザE2E(Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: .NET 10 SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: Chromium をインストール
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"

      - name: E2E テストを実行(バックエンド+フロントエンドを自動起動)
        run: npx playwright test

      - name: 失敗時のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  frontend:
    name: フロントエンド(型チェック・ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: 型チェックとビルド
        run: npm run build

  mutation:
    name: ミューテーションテスト(Stryker.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: .NET 10 SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: ツールを復元(dotnet-stryker)
        run: dotnet tool restore

      - name: ミューテーションテストを実行(Domain + Application)
        run: |
          status=0
          for proj in Domain Application; do
            echo "::group::Stryker ${proj}"
            (cd "tests/CostManagement.${proj}.Tests" && dotnet tool run dotnet-stryker) || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: ミューテーションスコアを実行サマリに表示
        if: always()
        run: |
          {
            echo '## ミューテーションテスト(Stryker.NET)'
            echo
            echo 'ミュータント(意図的なコード改変)をテストが検出できた割合。スコアが低い箇所は「テストが通っても仕様を守れていない」可能性がある。対象は Domain・Application 層(閾値は high:80 / low:60、CIは非ブロッキング)。'
            echo
            for proj in Domain Application; do
              md=$(ls -t "tests/CostManagement.${proj}.Tests"/StrykerOutput/*/reports/mutation-report.md 2>/dev/null | head -1)
              if [ -n "$md" ]; then
                echo "### ${proj} 層"
                echo
                cat "$md"
                echo
              else
                echo "### ${proj} 層"
                echo
                echo '（レポートが生成されませんでした）'
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: HTMLレポートを保存(アーティファクト)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: backend/tests/*/StrykerOutput/*/reports/mutation-report.html

  metrics:
    name: コードメトリクス(行数・複雑度)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cloc をインストール
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: scc をインストール(クロスプラットフォームのメトリクス集計)
        run: go install github.com/boyter/scc/v3@latest

      - name: 行数(cloc)と複雑度(scc)を3区分で集計
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          OUT=metrics-report.md
          : > "$OUT"
          EXCLUDES="bin,obj,dist,node_modules"
          区分() {
            local label="$1" dir="$2"
            {
              echo "#### ${label}（\`${dir}\`）"
              echo
              echo '**行数（cloc）**'
              echo
              cloc "$dir" --md --quiet --exclude-dir="$EXCLUDES"
              echo
              echo '**複雑度・行数（scc）**'
              echo
              echo '```'
              scc "$dir" --no-cocomo --exclude-dir "$EXCLUDES"
              echo '```'
              echo
            } >> "$OUT"
          }
          {
            echo '## コードメトリクス'
            echo
            echo '`cloc` は言語別の行数（コード/コメント/空行）、`scc` は行数＋複雑度（分岐数ベースの循環的複雑度の近似）を集計します。'
            echo
          } >> "$OUT"
          区分 'バックエンド 本体' backend/src
          区分 'バックエンド テスト' backend/tests
          区分 'フロントエンド' frontend/src
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: メトリクスレポートを保存(アーティファクト)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics
          path: metrics-report.md
