name: 工場のゲート

# 工場(ソフトウェアファクトリー)のゲートを機械で確かめる検査(ADR-0015)。
# 各ジョブの name が、main のルールセットの必須チェックになる(tools/factory/setup-github.sh)。
# 検査の中身は tools/factory/cli.mjs。PR だけで意味を持つ検査(持ち場・ゲートラベル・前提・工場の版)は、main への push では何もしない。
# ゲートラベルは Issue に付くので、ラベルを付けても PR の検査は動き直さない。付けたあとで「ゲートラベルの確認」を再実行する。
on:
  push:
    branches: [main]
  pull_request:
    # edited: PR の本文を直したら、閉じるキーワードの検査を動かし直す
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  # PR では、変えた場所に応じてジョブを飛ばす(#73)。どの場所でどのジョブを動かすかは tools/factory/lib/ci-scope.mjs。
  # main への push ではすべて動かす。飛ばしたジョブ(skipped)は、必須チェックとしては通ったものとして扱われる。
  changes:
    name: 変えた場所の判定(動かすジョブを決める)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      frontendUnit: ${{ steps.scope.outputs.frontendUnit }}
      browser: ${{ steps.scope.outputs.browser }}
      screens: ${{ steps.scope.outputs.screens }}
      mutation: ${{ steps.scope.outputs.mutation }}
      metrics: ${{ steps.scope.outputs.metrics }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PR の差分(base...head)を取るため
      - name: 変えたファイルから、動かすジョブを決める
        id: scope
        run: node tools/factory/ci-scope-cli.mjs
        env:
          # PR でないとき(main への push)は空になり、すべてのジョブを動かす
          FACTORY_BASE: ${{ github.event.pull_request.base.sha }}
          FACTORY_HEAD: ${{ github.event.pull_request.head.sha }}

  guard-hook:
    name: 工場のフック(ゲートを破る操作を止めるか)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: guard.sh の確認を実行
        run: bash .claude/hooks/guard.test.sh

  tools-test:
    name: 工場の検査スクリプトのテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/factory/package-lock.json
      - name: 依存を入れる
        run: npm ci
        working-directory: tools/factory
      - name: node --test を実行
        run: npm test
        working-directory: tools/factory

  screen-diff:
    name: 画面の差分(承認した画面との比較)
    needs: changes
    # 判定が失敗・取り消しのときも動かす(飛ばしたジョブは必須チェックを通ってしまうので、取りこぼさない側に倒す)
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.screens == 'true') }}
    runs-on: ubuntu-latest
    # 承認した画面はこのコンテナで撮る(tools/factory/update-approved-screens.sh)。版は tests/e2e/screens/package.json と同じにする
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: 1
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: 画面の依存を入れる
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: 検査の依存を入れる
        run: npm ci --no-audit --no-fund
        working-directory: tests/e2e/screens
      - name: 型チェック
        run: npm run typecheck
        working-directory: tests/e2e/screens
      - name: fixtures で開いた画面を、承認した画面と比べる
        run: npx playwright test
        working-directory: tests/e2e/screens
      - name: 差分のレポートを保存
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: screen-diff-report
          path: |
            tests/e2e/screens/playwright-report
            tests/e2e/screens/test-results
          if-no-files-found: ignore

  check:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: ears, title: "要件の書式(EARS)" }
          - { check: ambiguity, title: "曖昧語の検査" }
          - { check: coverage, title: "要件とシナリオの網羅" }
          - { check: knowledge, title: "ナレッジの出どころと確定" }
          - { check: screens, title: "画面要件と fixtures" }
          - { check: role, title: "工程の持ち場(role-guard)" }
          - { check: gate, title: "ゲートラベルの確認(gate-check)" }
          - { check: premises, title: "前提の版(upstream-approved)" }
          - { check: factory-version, title: "工場の版の更新(factory-version)" }
          - { check: closing, title: "作業項目を途中で閉じない(閉じるキーワード)" }
    env:
      FACTORY_BRANCH: ${{ github.head_ref }}
      FACTORY_BASE: ${{ github.event.pull_request.base.sha }}
      FACTORY_HEAD: ${{ github.event.pull_request.head.sha }}
      FACTORY_PR_BODY: ${{ github.event.pull_request.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PR の差分(base...head)と main の blob を読むため
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/factory/package-lock.json
      - name: 依存を入れる
        run: npm ci
        working-directory: tools/factory
      - name: 検査を実行
        run: node tools/factory/cli.mjs ${{ matrix.check }}
      - name: トレーサビリティマトリクスを保存
        if: ${{ always() && matrix.check == 'coverage' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-matrix
          path: coverage-matrix.md
          if-no-files-found: ignore
